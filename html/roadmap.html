<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>콩지커피 커피차 신청</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif;
      }

      ::-webkit-scrollbar {
        height: 8px;
        width: 8px;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(92, 59, 46, 0.22);
        border-radius: 9999px;
      }

      .sheet-open {
        overflow: hidden;
      }
    </style>
  </head>
  <body class="bg-[#f7f3ee] text-stone-800">
    <div class="min-h-screen bg-[radial-gradient(circle_at_top,_rgba(120,83,55,0.08),_transparent_35%),linear-gradient(180deg,_#fbf8f4_0%,_#f4eee7_100%)]">
      <div class="mx-auto flex min-h-screen w-full max-w-[1600px] flex-col xl:flex-row xl:items-start xl:gap-6">
        <section class="min-w-0 flex-1 px-4 pb-36 pt-4 sm:px-5 md:px-6 xl:px-8 xl:pb-8">
          <div class="mb-5 overflow-hidden rounded-[28px] border border-white/70 bg-white/85 shadow-[0_20px_60px_rgba(74,54,39,0.08)] backdrop-blur">
            <div class="p-5 sm:p-6 md:p-8">
              <div class="mb-3 inline-flex items-center gap-2 rounded-full bg-[#5c3b2e]/8 px-4 py-2 text-xs font-semibold tracking-[0.18em] text-[#5c3b2e] sm:text-sm">
                <span class="text-base tracking-normal">☕</span>
                KONGJI COFFEE TRUCK
              </div>
              <h1 class="text-[28px] font-black leading-tight tracking-tight text-[#3f2a1f] sm:text-[34px] md:text-[42px]">
                커피차 현장 주문
              </h1>
              <p class="mt-3 max-w-2xl text-sm leading-6 text-stone-500 sm:text-base">
                메뉴를 누르면 옵션을 고르고 장바구니에 바로 담을 수 있습니다.
              </p>
            </div>

            <div class="grid gap-3 border-t border-[#f0e7dd] bg-[#fcfaf7] px-5 py-4 text-sm text-stone-600 sm:px-6 md:grid-cols-3 md:px-8">
              <div class="flex items-center gap-3 rounded-2xl bg-white px-4 py-3 shadow-sm">
                <span class="text-lg">🚚</span>
                <div>
                  <p class="font-semibold text-stone-800">커피차 전용</p>
                  <p class="text-xs text-stone-500">현장 주문 흐름에 최적화</p>
                </div>
              </div>
              <div class="flex items-center gap-3 rounded-2xl bg-white px-4 py-3 shadow-sm">
                <span class="text-lg">🛒</span>
                <div>
                  <p class="font-semibold text-stone-800">실시간 장바구니</p>
                  <p class="text-xs text-stone-500">여러 잔 한 번에 담기</p>
                </div>
              </div>
              <div class="flex items-center gap-3 rounded-2xl bg-white px-4 py-3 shadow-sm">
                <span class="text-lg">📱</span>
                <div>
                  <p class="font-semibold text-stone-800">QR 모바일 대응예정</p>
                  <p class="text-xs text-stone-500">하단 요약바로 간결하게</p>
                </div>
              </div>
            </div>
          </div>

          <div class="mb-5 flex gap-2 overflow-x-auto pb-2 sm:gap-3">
            <button class="whitespace-nowrap rounded-full bg-[#5c3b2e] px-4 py-2.5 text-sm font-bold text-white shadow-md shadow-[#5c3b2e]/20 sm:px-5 sm:py-3">추천 메뉴</button>
            <button class="whitespace-nowrap rounded-full border border-[#eadfd3] bg-white/90 px-4 py-2.5 text-sm font-semibold text-stone-700 sm:px-5 sm:py-3">커피</button>
            <button class="whitespace-nowrap rounded-full border border-[#eadfd3] bg-white/90 px-4 py-2.5 text-sm font-semibold text-stone-700 sm:px-5 sm:py-3">라떼</button>
            <button class="whitespace-nowrap rounded-full border border-[#eadfd3] bg-white/90 px-4 py-2.5 text-sm font-semibold text-stone-700 sm:px-5 sm:py-3">에이드</button>
            <button class="whitespace-nowrap rounded-full border border-[#eadfd3] bg-white/90 px-4 py-2.5 text-sm font-semibold text-stone-700 sm:px-5 sm:py-3">티</button>
            <button class="whitespace-nowrap rounded-full border border-[#eadfd3] bg-white/90 px-4 py-2.5 text-sm font-semibold text-stone-700 sm:px-5 sm:py-3">디저트</button>
          </div>

          <div id="menuGrid" class="grid grid-cols-2 gap-3 sm:gap-4 lg:grid-cols-3 2xl:grid-cols-4"></div>
        </section>

        <aside class="hidden xl:block xl:sticky xl:top-8 xl:w-[400px] xl:flex-shrink-0 xl:overflow-hidden xl:rounded-[32px] xl:border xl:border-white/10 xl:bg-[#4b3126] xl:text-white xl:shadow-[0_24px_70px_rgba(65,41,28,0.28)]">
          <div class="border-b border-white/10 bg-[linear-gradient(135deg,rgba(255,255,255,0.08),transparent)] p-6">
            <div class="mb-5 flex items-center justify-between">
              <div>
                <p class="text-sm font-medium text-white/70">CART</p>
                <h2 class="mt-1 text-3xl font-black">장바구니</h2>
              </div>
              <span id="desktopCartCount" class="rounded-full bg-white/10 px-4 py-2 text-sm font-semibold">0 items</span>
            </div>
          </div>

          <div class="p-6">
            <div id="desktopCartList" class="space-y-3"></div>

            <div class="mt-5 rounded-[24px] bg-white/6 p-5">
              <div class="flex items-center justify-between text-sm text-white/70">
                <span>총 메뉴 수량</span>
                <span id="desktopTotalQty">0잔</span>
              </div>
              <div class="mt-4 flex items-center justify-between text-xl font-black">
                <span>총 주문 수량</span>
                <span id="desktopTotalPrice">0잔</span>
              </div>
            </div>

            <div class="mt-5 grid grid-cols-2 gap-3">
              <button id="desktopClearBtn" class="rounded-2xl border border-white/15 bg-white/8 px-4 py-4 text-base font-bold text-white">전체 비우기</button>
              <button class="rounded-2xl bg-[#f0d5b5] px-4 py-4 text-base font-black text-[#4b3126] shadow-lg shadow-black/10">주문 요청</button>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <div class="fixed inset-x-0 bottom-0 z-30 xl:hidden">
      <div class="mx-auto max-w-[720px] px-3 pb-3">
        <button id="mobileCartBar" class="flex w-full items-center justify-between rounded-[22px] bg-[#4b3126] px-4 py-3 text-left text-white shadow-[0_16px_40px_rgba(65,41,28,0.24)]">
          <div class="min-w-0">
            <p class="text-[11px] font-medium tracking-[0.18em] text-white/60">CART</p>
            <div class="mt-1 flex items-center gap-2">
              <span id="mobileCartQty" class="rounded-full bg-white/10 px-2.5 py-1 text-xs font-semibold">0잔</span>
              <span id="mobileCartItems" class="truncate text-sm font-semibold text-white/85">장바구니가 비어있습니다</span>
            </div>
          </div>
          <div class="ml-3 shrink-0 text-right">
            <p id="mobileCartPrice" class="text-lg font-black">0잔</p>
            <p class="text-xs text-white/60">장바구니 보기</p>
          </div>
        </button>
      </div>
    </div>

    <div id="sheetOverlay" class="pointer-events-none fixed inset-0 z-40 bg-black/30 opacity-0 transition duration-300"></div>

    <div id="optionSheet" class="pointer-events-none fixed inset-x-0 bottom-0 z-50 translate-y-full transition duration-300 xl:hidden">
      <div class="mx-auto max-w-[720px] rounded-t-[32px] bg-[#fffaf5] p-5 shadow-[0_-20px_50px_rgba(0,0,0,0.18)]">
        <div class="mx-auto mb-4 h-1.5 w-14 rounded-full bg-stone-300"></div>
        <div class="mb-4 flex items-start justify-between gap-3">
          <div>
            <p class="text-xs font-semibold tracking-[0.18em] text-[#8b6a56]">MENU OPTION</p>
            <h3 id="sheetMenuName" class="mt-1 text-2xl font-black text-[#3f2a1f]"></h3>
            <p id="sheetMenuDesc" class="mt-2 text-sm leading-6 text-stone-500"></p>
          </div>
          <button data-close-sheet class="rounded-full bg-stone-200 px-3 py-2 text-sm font-bold text-stone-700">닫기</button>
        </div>

        <div class="rounded-[24px] bg-white p-4 shadow-sm">
          <div class="mb-4 flex items-center justify-between">
            <p class="font-bold text-stone-800">온도 선택</p>
            <p class="text-sm text-stone-400">1개 선택</p>
          </div>
          <div id="tempOptions" class="grid grid-cols-2 gap-2"></div>
        </div>

        <div class="mt-3 rounded-[24px] bg-white p-4 shadow-sm">
          <div class="mb-4 flex items-center justify-between">
            <p class="font-bold text-stone-800">사이즈 선택</p>
            <p class="text-sm text-stone-400">1개 선택</p>
          </div>
          <div id="sizeOptions" class="grid grid-cols-2 gap-2"></div>
        </div>

        <div class="mt-4 flex items-center justify-between rounded-[24px] bg-[#f4ece3] px-4 py-4">
          <div>
            <p class="text-sm text-stone-500">선택된 옵션</p>
            <p id="sheetPrice" class="mt-1 text-xl font-black text-[#5c3b2e]"></p>
          </div>
          <button id="addToCartBtn" class="rounded-2xl bg-[#5c3b2e] px-5 py-3 text-sm font-bold text-white shadow-md shadow-[#5c3b2e]/20">장바구니 담기</button>
        </div>
      </div>
    </div>

    <div id="cartSheet" class="pointer-events-none fixed inset-x-0 bottom-0 z-50 translate-y-full transition duration-300 xl:hidden">
      <div class="mx-auto max-w-[720px] rounded-t-[32px] bg-[#4b3126] p-5 text-white shadow-[0_-20px_50px_rgba(0,0,0,0.24)]">
        <div class="mx-auto mb-4 h-1.5 w-14 rounded-full bg-white/20"></div>
        <div class="mb-4 flex items-center justify-between">
          <div>
            <p class="text-xs font-medium tracking-[0.18em] text-white/60">CART</p>
            <h3 class="mt-1 text-2xl font-black">장바구니</h3>
          </div>
          <button data-close-cart class="rounded-full bg-white/10 px-3 py-2 text-sm font-bold text-white">닫기</button>
        </div>

        <div id="mobileCartList" class="max-h-[46vh] space-y-3 overflow-y-auto pr-1"></div>

        <div class="mt-4 rounded-[24px] bg-white/8 p-4">
          <div class="flex items-center justify-between text-sm text-white/70">
            <span>총 메뉴 수량</span>
            <span id="mobileTotalQty">0잔</span>
          </div>
          <div class="mt-3 flex items-center justify-between text-lg font-black">
            <span>총 주문 수량</span>
            <span id="mobileTotalPrice">0잔</span>
          </div>
        </div>

        <div class="mt-4 grid grid-cols-2 gap-3">
          <button id="mobileClearBtn" class="rounded-2xl border border-white/15 bg-white/8 px-4 py-4 text-sm font-bold text-white">전체 비우기</button>
          <button class="rounded-2xl bg-[#f0d5b5] px-4 py-4 text-sm font-black text-[#4b3126]">주문 요청</button>
        </div>
      </div>
    </div>

    <script>
      const menuData = [
        { id: 1, name: '아메리카노', desc: '콩지커피의 기본이 되는 깔끔하고 진한 커피', emoji: '☕', badge: 'BEST', bg: 'from-[#f5ede3] to-[#e9d9c8]', temps: ['ICE', 'HOT'], sizes: [{ name: 'Regular' }, { name: 'Large' }] },
        { id: 2, name: '카페라떼', desc: '부드러운 우유와 에스프레소의 균형감', emoji: '🥛', bg: 'from-[#f4efe8] to-[#e7dfd4]', temps: ['ICE', 'HOT'], sizes: [{ name: 'Regular' }, { name: 'Large' }] },
        { id: 3, name: '바닐라라떼', desc: '은은한 바닐라 향이 더해진 달콤한 라떼', emoji: '🍦', bg: 'from-[#f7ecdf] to-[#f0d9bf]', temps: ['ICE', 'HOT'], sizes: [{ name: 'Regular' }, { name: 'Large' }] },
        { id: 4, name: '딸기라떼', desc: '부드럽고 사랑스러운 콩지커피 인기 메뉴', emoji: '🍓', badge: 'SIGNATURE', bg: 'from-[#f9e7ea] to-[#f4ccd4]', temps: ['ICE'], sizes: [{ name: 'Regular' }, { name: 'Large' }] },
        { id: 5, name: '자몽에이드', desc: '상큼한 과즙감이 돋보이는 산뜻한 에이드', emoji: '🍹', bg: 'from-[#fff1d6] to-[#ffe2a6]', temps: ['ICE'], sizes: [{ name: 'Regular' }, { name: 'Large' }] },
        { id: 6, name: '허니자몽블랙티', desc: '달콤함과 쌉싸름함이 조화로운 티 음료', emoji: '🍯', bg: 'from-[#f5e9d7] to-[#edd1a7]', temps: ['ICE', 'HOT'], sizes: [{ name: 'Regular' }, { name: 'Large' }] },
        { id: 7, name: '초당옥수수라떼', desc: '고소하고 진한 풍미의 시즌 시그니처', emoji: '🌽', bg: 'from-[#fff6dc] to-[#f7e698]', temps: ['ICE', 'HOT'], sizes: [{ name: 'Regular' }, { name: 'Large' }] },
        { id: 8, name: '콘스프', desc: '음료와 함께 즐기기 좋은 든든한 사이드', emoji: '🥣', bg: 'from-[#f7eadf] to-[#e9c5a7]', temps: ['HOT'], sizes: [{ name: '1컵' }] },
      ];

      const state = {
        cart: [],
        activeMenu: null,
        selectedTemp: null,
        selectedSize: null,
      };

      const menuGrid = document.getElementById('menuGrid');
      const desktopCartList = document.getElementById('desktopCartList');
      const mobileCartList = document.getElementById('mobileCartList');
      const desktopCartCount = document.getElementById('desktopCartCount');
      const desktopTotalQty = document.getElementById('desktopTotalQty');
      const desktopTotalPrice = document.getElementById('desktopTotalPrice');
      const mobileCartQty = document.getElementById('mobileCartQty');
      const mobileCartItems = document.getElementById('mobileCartItems');
      const mobileCartPrice = document.getElementById('mobileCartPrice');
      const mobileTotalQty = document.getElementById('mobileTotalQty');
      const mobileTotalPrice = document.getElementById('mobileTotalPrice');
      const optionSheet = document.getElementById('optionSheet');
      const cartSheet = document.getElementById('cartSheet');
      const sheetOverlay = document.getElementById('sheetOverlay');
      const sheetMenuName = document.getElementById('sheetMenuName');
      const sheetMenuDesc = document.getElementById('sheetMenuDesc');
      const tempOptions = document.getElementById('tempOptions');
      const sizeOptions = document.getElementById('sizeOptions');
      const sheetPrice = document.getElementById('sheetPrice');
      const addToCartBtn = document.getElementById('addToCartBtn');
      const mobileCartBar = document.getElementById('mobileCartBar');

      function formatCount(value) {
        return `${value.toLocaleString('ko-KR')}잔`;
      }

      function renderMenus() {
        menuGrid.innerHTML = menuData.map(menu => `
          <article class="group rounded-[24px] border border-white/70 bg-white/90 p-3 shadow-[0_12px_40px_rgba(74,54,39,0.08)] transition duration-300 hover:-translate-y-1 hover:shadow-[0_20px_50px_rgba(74,54,39,0.14)] sm:rounded-[28px] sm:p-4">
            <button onclick="openOptionSheet(${menu.id})" class="block w-full text-left">
              <div class="mb-3 flex aspect-[1/1] items-center justify-center rounded-[20px] bg-gradient-to-br ${menu.bg} text-5xl sm:mb-4 sm:rounded-[24px] sm:text-6xl">${menu.emoji}</div>
              <div class="mb-2 flex items-start justify-between gap-2">
                <h2 class="text-base font-bold leading-snug text-[#3f2a1f] sm:text-lg">${menu.name}</h2>
                ${menu.badge ? `<span class="rounded-full ${menu.badge === 'BEST' ? 'bg-[#5c3b2e] text-white' : 'bg-[#efe2d4] text-[#7a5240]'} px-2 py-1 text-[10px] font-bold sm:px-2.5 sm:text-[11px]">${menu.badge}</span>` : ''}
              </div>
              <p class="min-h-[40px] text-xs leading-5 text-stone-500 sm:min-h-[44px] sm:text-sm">${menu.desc}</p>
              <div class="mt-3 flex items-center justify-between gap-2 sm:mt-4">
                <p class="text-sm font-bold text-[#8b6a56] sm:text-base">음료 주문</p>
                <span class="rounded-full bg-[#f3ebe2] px-3 py-2 text-[11px] font-bold text-[#5c3b2e] sm:px-4 sm:text-xs">선택</span>
              </div>
            </button>
          </article>
        `).join('');
      }

      function renderOptionButtons(container, items, selectedValue, type) {
        container.innerHTML = items.map(item => {
          const label = typeof item === 'string' ? item : item.name;
          const value = typeof item === 'string' ? item : item.name;
          const extra = typeof item === 'string' ? '' : '기본 선택 옵션';
          const selected = value === selectedValue;

          return `
            <button onclick="selectOption('${type}', '${value}')" class="rounded-2xl border px-4 py-3 text-left transition ${selected ? 'border-[#5c3b2e] bg-[#5c3b2e] text-white shadow-md shadow-[#5c3b2e]/15' : 'border-[#eadfd3] bg-[#fcfaf7] text-stone-700'}">
              <p class="font-bold">${label}</p>
              ${typeof item === 'string' ? `<p class="mt-1 text-xs ${selected ? 'text-white/70' : 'text-stone-400'}">기본 선택 옵션</p>` : `<p class="mt-1 text-xs ${selected ? 'text-white/70' : 'text-stone-400'}">${extra}</p>`}
            </button>
          `;
        }).join('');
      }

      function getSelectedLabel() {
        if (!state.activeMenu || !state.selectedSize) return '';
        return `${state.selectedTemp} · ${state.selectedSize}`;
      }

      function updateSheetPrice() {
        sheetPrice.textContent = getSelectedLabel();
      }

      window.openOptionSheet = function(menuId) {
        const menu = menuData.find(item => item.id === menuId);
        state.activeMenu = menu;
        state.selectedTemp = menu.temps[0];
        state.selectedSize = menu.sizes[0].name;

        sheetMenuName.textContent = menu.name;
        sheetMenuDesc.textContent = menu.desc;
        renderOptionButtons(tempOptions, menu.temps, state.selectedTemp, 'temp');
        renderOptionButtons(sizeOptions, menu.sizes, state.selectedSize, 'size');
        updateSheetPrice();

        optionSheet.classList.remove('pointer-events-none', 'translate-y-full');
        sheetOverlay.classList.remove('pointer-events-none', 'opacity-0');
        document.body.classList.add('sheet-open');
      };

      window.selectOption = function(type, value) {
        if (type === 'temp') state.selectedTemp = value;
        if (type === 'size') state.selectedSize = value;
        renderOptionButtons(tempOptions, state.activeMenu.temps, state.selectedTemp, 'temp');
        renderOptionButtons(sizeOptions, state.activeMenu.sizes, state.selectedSize, 'size');
        updateSheetPrice();
      };

      function closeOptionSheet() {
        optionSheet.classList.add('pointer-events-none', 'translate-y-full');
        if (cartSheet.classList.contains('translate-y-full')) {
          sheetOverlay.classList.add('pointer-events-none', 'opacity-0');
          document.body.classList.remove('sheet-open');
        }
      }

      function openCartSheet() {
        cartSheet.classList.remove('pointer-events-none', 'translate-y-full');
        sheetOverlay.classList.remove('pointer-events-none', 'opacity-0');
        document.body.classList.add('sheet-open');
      }

      function closeCartSheet() {
        cartSheet.classList.add('pointer-events-none', 'translate-y-full');
        if (optionSheet.classList.contains('translate-y-full')) {
          sheetOverlay.classList.add('pointer-events-none', 'opacity-0');
          document.body.classList.remove('sheet-open');
        }
      }

      function addToCart() {
        if (!state.activeMenu) return;
        const size = state.activeMenu.sizes.find(item => item.name === state.selectedSize);
        const unitPrice = 0;
        const key = `${state.activeMenu.id}-${state.selectedTemp}-${state.selectedSize}`;
        const found = state.cart.find(item => item.key === key);

        if (found) {
          found.qty += 1;
        } else {
          state.cart.push({
            key,
            menuId: state.activeMenu.id,
            name: state.activeMenu.name,
            temp: state.selectedTemp,
            size: state.selectedSize,
            unitPrice,
            qty: 1,
          });
        }

        renderCart();
        closeOptionSheet();
      }

      function changeQty(key, delta) {
        const found = state.cart.find(item => item.key === key);
        if (!found) return;
        found.qty += delta;
        if (found.qty <= 0) {
          state.cart = state.cart.filter(item => item.key !== key);
        }
        renderCart();
      }

      function clearCart() {
        state.cart = [];
        renderCart();
      }

      function renderCartItems(listType) {
        const list = listType === 'desktop' ? desktopCartList : mobileCartList;
        const isMobile = listType === 'mobile';

        if (!state.cart.length) {
          list.innerHTML = `<div class="rounded-[24px] ${isMobile ? 'bg-white/8' : 'bg-white/6'} p-5 text-center text-sm ${isMobile ? 'text-white/70' : 'text-white/60'}">아직 담긴 메뉴가 없습니다.</div>`;
          return;
        }

        list.innerHTML = state.cart.map(item => `
          <div class="rounded-[20px] bg-white/${isMobile ? '8' : '8'} p-3 backdrop-blur-sm xl:rounded-[24px] xl:p-4">
            <div class="mb-2 flex items-start justify-between gap-3">
              <div class="min-w-0">
                <p class="truncate font-bold">${item.name}</p>
                <p class="mt-1 text-xs text-white/60 xl:text-sm">${item.temp} · ${item.size}</p>
              </div>
              <p class="shrink-0 font-bold">${item.qty}잔</p>
            </div>
            <div class="flex items-center justify-between">
              <span class="text-xs text-white/70 xl:text-sm">수량 ${item.qty}</span>
              <div class="flex items-center gap-2">
                <button onclick="changeQty('${item.key}', -1)" class="flex h-8 w-8 items-center justify-center rounded-full bg-white/10 text-base">−</button>
                <span class="w-6 text-center font-semibold">${item.qty}</span>
                <button onclick="changeQty('${item.key}', 1)" class="flex h-8 w-8 items-center justify-center rounded-full bg-white text-[#4b3126]">+</button>
              </div>
            </div>
          </div>
        `).join('');
      }

      function renderCart() {
        const totalQty = state.cart.reduce((sum, item) => sum + item.qty, 0);
        const totalPrice = state.cart.reduce((sum, item) => sum + item.qty, 0);
        const uniqueItems = state.cart.length;

        renderCartItems('desktop');
        renderCartItems('mobile');

        desktopCartCount.textContent = `${uniqueItems} items`;
        desktopTotalQty.textContent = `${totalQty}잔`;
        desktopTotalPrice.textContent = formatCount(totalPrice);
        mobileTotalQty.textContent = `${totalQty}잔`;
        mobileTotalPrice.textContent = formatCount(totalPrice);
        mobileCartQty.textContent = `${totalQty}잔`;
        mobileCartPrice.textContent = formatCount(totalPrice);
        mobileCartItems.textContent = uniqueItems ? `${state.cart[0].name}${uniqueItems > 1 ? ` 외 ${uniqueItems - 1}` : ''}` : '장바구니가 비어있습니다';
      }

      document.querySelectorAll('[data-close-sheet]').forEach(button => {
        button.addEventListener('click', closeOptionSheet);
      });

      document.querySelectorAll('[data-close-cart]').forEach(button => {
        button.addEventListener('click', closeCartSheet);
      });

      sheetOverlay.addEventListener('click', () => {
        closeOptionSheet();
        closeCartSheet();
      });

      addToCartBtn.addEventListener('click', addToCart);
      mobileCartBar.addEventListener('click', openCartSheet);
      document.getElementById('desktopClearBtn').addEventListener('click', clearCart);
      document.getElementById('mobileClearBtn').addEventListener('click', clearCart);

      window.changeQty = changeQty;

      renderMenus();
      renderCart();
    </script>
  </body>
</html>
